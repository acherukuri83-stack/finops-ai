services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: finops
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finops
      SPRING_DATASOURCE_USERNAME: finops
      SPRING_DATASOURCE_PASSWORD: finops
    ports:
      - "8080:8080"
    depends_on:
      - postgres
