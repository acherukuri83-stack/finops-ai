spring.application.name=finops-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finops}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finops}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finops}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.port=8080
